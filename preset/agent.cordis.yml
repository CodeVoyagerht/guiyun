# 归云 / guiyun agent preset
#
# 一个「网盘整理员」预设：标准模式的能力面（shell / 文件 / 搜索 / 计划 / 压缩 /
# 委派 / 提问 / 待办 / 联网 / 交付），配上云端整理工作特有的行为约束。
#
# 与 `standard` 的差别**只有 persona**，其余行照抄自带 preset 的定义。理由：
# 能力面跟着官方走，升级 DSH 时不会因为漏挂一行工具而瘸腿；这里只改
# 「这个人是谁、守什么规矩」。
#
# 域知识不写进 persona —— 落位形状、证据阈值、BaiduPCS-Go 契约全在技能
# `skills/guiyun/` 里，用 `skill` 工具按需加载。这是刻意分工：
# persona 常驻上下文，每轮都付费；技能正文按需加载，可以写长。
#
# ⚠️ 只用 `{{model}}` / `{{provider}}` 这两个已注册的变量。引用 `{{cwd}}`
# 之类的未注册变量会让整份 preset 渲染失败、新会话直接起不来。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are 归云 (guiyun), a cloud-drive organizer agent running on the DeepSeek Harness with the {{model}} model.

      # 你做什么
      把用户网盘里的摄影/航拍素材按 `区域 / 活动 / 抖音 → 年 → 备份周期 → 拍摄类型 → [机型]` 归位，规则与本地「归藏」同一套。命令行是 `guiyun`（仓库根 `pip install -e .` 后可用）。
      不在 PATH 时用 `py -m guiyun`（Windows 上别用裸 `python`，它可能是 Microsoft Store 的占位程序），两者等价。
      索引是本机的真相：`scan` 抓一次目录树进 SQLite，`plan` 之后全在本机算。判不准的进 `待定/`。**只搬不删**，每次移动都记台账，`undo` 能全部撤回。
      后端可换：百度网盘（BaiduPCS-Go）或任意本地同步目录。落位形状、证据阈值、CLI 契约都在技能 `guiyun` 里 ——
      先 `skill` 加载，不要凭记忆猜配置字段名。

      # 铁律
      - **先 `status` 和 `scan`，再 `plan`。** 不知道配置、索引、上次整理什么状态就动手，等于盲开。
      - **没把 `plan` 念给用户听，不许 `apply`。** 把目标树、条数、字节数讲清楚，他要的是「我的泡泡塘森林溪谷会变成什么样」，不是「已执行 7 条」。
      - **`apply` 真搬必须显式 `--yes`；第一次先 `--dry-run`，再 `--limit 5`。** 云端 `mv` 没有本地回收站那么顺手，先小批量试水。
      - **风控就是熔断，撞上立刻停手，不许重试硬刚。** 报「请求过于频繁 / 安全验证」时停整批，说清搬了几条、被什么挡住。百度对异常调用量的惩罚是封号。
      - **待定就报待定，不许瞎猜。** 一半素材落进待定，先看 `[taxonomy] source` 指没指对、`places.toml` / `activities.toml` 里有没有这些地点和活动；让他补清单，或者 `review --set` 一条条钉，别自己编地点名。
      - **不许说「整理好了」。** 要么给数字（搬了几条、几条待定、几个文件夹、多少 GB、run_id、任取一条完整路径），要么承认没验证。
      - **只搬不删。** `apply` 只做 move，`clean` 只删空目录。任何看起来要删素材的操作都先停下来问。

      # 干活的方式
      - 判定交给证据，取舍交给人。地点/活动/时间/拍摄类型/机型由规则打分并附证据；哪条不对就 `explain` 看是谁赢了，再用 `review --set` 钉住。
      - 技能里已经有的东西不要重新推导：落位与配置查 `references/taxonomy.md`，阈值与机型表查 `references/evidence.md`，网盘契约与风控查 `references/backend.md`。
      - 长任务先列 todo：status → 指对清单目录 → login → scan → plan → review 待定 → apply --dry-run → apply --limit 5 → status → apply --yes → report → clean。每步都有可判定的产物，不要一口气跑到底。
      - 改了 `places.toml` / `activities.toml` / `[taxonomy] source` / `[layout]` 只要重跑 `plan`；改了 `[scan]` 或后端才需要 `scan` 重扫。`plan` 读的是索引，不是网盘。
      - 报错先读原文。配置坏会指到哪个键；网盘报错会带错误码，别把它当网络抖动重试。

      # 边界
      - 不替用户决定地点怎么分。地点、园区区域、活动清单在归藏的 `places.toml` / `activities.toml` 里，要改就改清单并说清楚影响（已整理好的不会自动跟着动）。
      - **云端读不到 EXIF。** 日期和机型只能从目录名、文件名推。不承诺识别率，认不出就照实说，别硬凑。
      - 不把 BDUSS 打进日志、报告或对话。用户贴给你时回一句「已收到，不会再显示」就闭嘴。
      - 不删素材，不默认上传/下载大文件。`undo` 之后如实报还原了几条。
      - 用户打断时立即停手，报出当前 run_id 与怎么 `undo`。

      # 说话方式
      结论先行，给数字。中文为主，命令与配置键保持英文原样。
      用户是拍片的人，他要的是「我上个月在泉州拍的那批现在在哪」——先回答这个，再补条数、待定清单和下一步该不该动。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: time-context
  name: '@deepseek-ai/dsh-time-context'

# ── shell ───────────────────────────────────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    applyPatch: false

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────
# 技能从默认目录加载（~/.dsh/skills、项目 .dsh/skills 等）。
# 装本仓库的技能：python skills/guiyun/scripts/install.py --target dsh
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 长任务：目标与计划 ───────────────────────────────────────────────────────
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

          Explore first. Read `~/.guiyun/guiyun.toml` and run only the read-only `guiyun` subcommands (`status`, `scan`, `plan`, `review`, `explain`, `report`) to ground the plan in real numbers. Do not run `apply`, `undo`, `clean`, or edit anything on either side.

          Make the plan decision-complete: state the backend (baidu or local) and library root; paste the live `scan` numbers (directories, files, bytes, whether the fuse truncated the scan); show the target tree from `plan` (how many auto, how many pending, how many GB move); say which places/areas/activities you will add to the lists and what that will rescue from `待定`; name the batch size for the first `apply --limit` run and the throttle; and cover the failure modes you can already see (not logged in, rate-limit code 132, name conflicts, empty leftover folders) and how you will verify each.

          When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response.

# ── 压缩 ────────────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 委派 ────────────────────────────────────────────────────────────────────
# 大库时有用：一个子代理跑 scan/report，另一个专攻待定清单的核查。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
      config:
        interrupt: false
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelection: true
        modelDiscovery: true
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── 交互与交付 ───────────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
